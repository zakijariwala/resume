name: Deploy API Worker

# Production for this repo is the `ai-pm` branch — Cloudflare Pages builds the
# static site from it. The Worker follows the same branch so the API and the
# site it serves never diverge. (The phase brief said `main`; main trails
# ai-pm by 31+ commits and serves nothing, so following it would deploy a
# Worker that does not match the live site.)
on:
  push:
    branches: [ai-pm]
    paths:
      - 'worker/**'
      - '.github/workflows/deploy-worker.yml'
  workflow_dispatch:

# One deploy at a time; a queued run should not overtake a running one.
concurrency:
  group: deploy-worker
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - run: npm ci

      # Validates wrangler.toml and type-checks the bundle before anything is
      # applied to the database. A broken config fails here, not after a
      # half-finished migration.
      - name: Validate worker build
        run: npx wrangler deploy --config worker/wrangler.toml --dry-run
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      # Migrations run before the deploy: new code may depend on new schema,
      # and D1 migrations are additive, so old code tolerates the new tables.
      - name: Apply D1 migrations
        run: npx wrangler d1 migrations apply zakijariwala --config worker/wrangler.toml --remote
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Deploy worker
        run: npx wrangler deploy --config worker/wrangler.toml
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Verify health
        run: |
          for i in 1 2 3 4 5; do
            code=$(curl -s -o /tmp/health.json -w '%{http_code}' https://zakijariwala.space/api/health || true)
            if [ "$code" = "200" ]; then cat /tmp/health.json; exit 0; fi
            echo "attempt $i: HTTP $code"; sleep 6
          done
          echo "health check never returned 200"; cat /tmp/health.json || true; exit 1
