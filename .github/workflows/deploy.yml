name: Deploy to Cloudflare Pages

on:
  push:
    branches:
      - experimental

# Required GitHub Secrets in Repository Settings:
# 1. CF_ACCOUNT_ID - Your Cloudflare Account ID
# 2. CF_API_TOKEN - Your Cloudflare API Token for Pages
# 3. CF_PROJECT_NAME - Your Cloudflare Pages Project Name

jobs:
  deploy:
    name: Build & Deploy to Cloudflare Pages
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm install

      - name: Build Astro Project
        run: npm run build

      - name: Check JS bundle size
        run: |
          total=0
          if [ -d "dist/_astro" ]; then
            total=$(find dist/_astro -name "*.js" -exec wc -c {} + | awk '{s+=$1} END {print s+0}')
          fi
          echo "Total JS: $total bytes"
          if [ $total -gt 122880 ]; then
            echo "JS budget exceeded: $total > 120kb"
            exit 1
          fi

      - name: Deploy compiled static assets to Cloudflare Pages
        uses: cloudflare/pages-action@v1
        with:
          apiToken: ${{ secrets.CF_API_TOKEN }}
          accountId: ${{ secrets.CF_ACCOUNT_ID }}
          projectName: ${{ secrets.CF_PROJECT_NAME }}
          directory: dist
          gitBranch: experimental
