name: Sync and deploy

# sync     — Worker cron (Mon 03:00 UTC) or "Sync repos now" in admin: fetch every repo's for_resume/, rebuild, deploy
# rebuild  — admin toggles / profile edits: rebuild from current data, deploy
# push     — code changes on main: rebuild from current data, deploy
on:
  repository_dispatch:
    types: [sync, rebuild]
  workflow_dispatch:
    inputs:
      sync:
        description: Fetch repos before building
        type: boolean
        default: true
  push:
    branches: [main]

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      WORKER_URL: ${{ vars.WORKER_URL }}
      BUILD_TOKEN: ${{ secrets.BUILD_TOKEN }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      PUBLIC_TURNSTILE_SITE_KEY: ${{ vars.TURNSTILE_SITE_KEY }}
      SNAPSHOT_FILE: .snapshot.json
      REQUIRE_SNAPSHOT: '1'
      WRANGLER_SEND_METRICS: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      - name: Configure wrangler
        run: |
          sed -i 's/REPLACE_WITH_D1_ID/${{ vars.D1_DATABASE_ID }}/' wrangler.jsonc
          sed -i 's/"TURNSTILE_SITE_KEY": ""/"TURNSTILE_SITE_KEY": "${{ vars.TURNSTILE_SITE_KEY }}"/' wrangler.jsonc
          sed -i 's|"ACCESS_TEAM_DOMAIN": ""|"ACCESS_TEAM_DOMAIN": "${{ vars.ACCESS_TEAM_DOMAIN }}"|' wrangler.jsonc
          sed -i 's/"ACCESS_AUD": ""/"ACCESS_AUD": "${{ vars.ACCESS_AUD }}"/' wrangler.jsonc
          sed -i 's/"OWNER_EMAIL": ""/"OWNER_EMAIL": "${{ vars.OWNER_EMAIL }}"/' wrangler.jsonc

      - name: Apply database migrations
        run: npx wrangler d1 migrations apply zakijariwala --remote

      # First deploy only: the Worker must exist before the sync can post to it.
      - name: Bootstrap Worker if not live
        run: |
          if ! curl -sf -o /dev/null -H "authorization: Bearer $BUILD_TOKEN" "$WORKER_URL/internal/snapshot"; then
            echo "Worker not reachable — deploying an empty build first"
            node --experimental-strip-types scripts/sync.ts bootstrap
            npm run build
            npx wrangler deploy
          fi

      - name: Sync repositories
        if: github.event.action == 'sync' || (github.event_name == 'workflow_dispatch' && inputs.sync)
        env:
          GITHUB_TOKEN: ${{ secrets.PORTFOLIO_GITHUB_TOKEN }}
        run: npm run sync

      - name: Fetch snapshot
        if: ${{ !(github.event.action == 'sync' || (github.event_name == 'workflow_dispatch' && inputs.sync)) }}
        run: node --experimental-strip-types scripts/sync.ts snapshot

      - name: Build
        run: npm run build

      - name: Deploy
        run: npx wrangler deploy
