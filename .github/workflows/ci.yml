name: CI

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Type-check site and Worker
        run: npm run check
      - name: Build from fixtures
        run: npm run build
      - name: Validate Worker bundle
        run: npx wrangler deploy --dry-run --outdir .wrangler/dry-run
